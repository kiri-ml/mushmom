<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MapleLegends population over time."
      data-i18n-content="meta.description"
    />
    <title data-i18n="meta.title">Mushmom | MapleLegends Population Tracker</title>
    <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="hero.eyebrow">MapleLegends population tracker</p>
          <div class="title-lockup">
            <h1 id="page-title" data-i18n="app.name">Mushmom</h1>
            <img
              src="/assets/icons/mushmom.png"
              alt=""
              class="hero-mushmom"
              width="119"
              height="110"
              aria-hidden="true"
            />
          </div>
          <p class="lede">
            <span data-i18n="hero.lede.prefix">MapleLegends population over time, inspired by</span>
            <a href="https://geospiza.me/ml-online/">geospiza</a><span data-i18n="hero.lede.suffix">.</span>
          </p>
        </div>
        <div class="hero-actions">
          <div
            class="stats-load-status"
            aria-label="Historical stats load status"
            data-i18n-aria-label="aria.statsLoadStatus"
          >
            <span class="stats-load-status-dot" id="stats-load-status-dot" aria-hidden="true"></span>
            <span id="stats-load-status-text" data-i18n="status.loading">LOADING</span>
          </div>
          <div class="language-selector">
            <i
              data-lucide="languages"
              class="language-selector-icon"
              aria-hidden="true"
            ></i>
            <select
              id="language-select"
              class="language-switcher"
              aria-label="Language"
              data-i18n-aria-label="language.label"
            ></select>
          </div>
        </div>
      </section>

      <section
        class="metrics"
        aria-label="Latest MapleLegends metrics"
        data-i18n-aria-label="aria.latestMetrics"
      >
        <article class="metric-card metric-card--live">
          <span data-i18n="metric.charactersOnline">Characters online</span>
          <strong id="current-character-count">--</strong>
          <p class="metric-secondary"><span id="current-player-count" class="metric-secondary-value">--</span><span class="metric-secondary-label" data-i18n="metric.players">Players</span></p>
        </article>
        <article class="metric-card metric-card--cycling" data-metric-board tabindex="0">
          <div class="metric-card__content">
            <div class="metric-card__heading">
              <span data-i18n="metric.peak">Peak online</span>
              <span id="peak-period-label" class="metric-card__period metric-card__dynamic-value">24 h</span>
            </div>
            <strong id="peak-character-count" class="metric-card__dynamic-value">--</strong>
            <p class="metric-secondary"><span id="peak-player-count" class="metric-secondary-value metric-card__dynamic-value">--</span><span class="metric-secondary-label" data-i18n="metric.players">Players</span></p>
          </div>
          <div class="metric-card__range-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        </article>
        <article class="metric-card metric-card--cycling" data-metric-board tabindex="0">
          <div class="metric-card__content">
            <div class="metric-card__heading">
              <span data-i18n="metric.average">Average online</span>
              <span id="average-period-label" class="metric-card__period metric-card__dynamic-value">24 h</span>
            </div>
            <strong id="average-character-count" class="metric-card__dynamic-value">--</strong>
            <p class="metric-secondary"><span id="average-player-count" class="metric-secondary-value metric-card__dynamic-value">--</span><span class="metric-secondary-label" data-i18n="metric.players">Players</span></p>
          </div>
          <div class="metric-card__range-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        </article>
        <article class="metric-card metric-card--time">
          <span data-i18n="metric.lastSample">Last sample</span>
          <strong id="last-sample">--</strong>
          <p class="metric-secondary"><span id="last-sample-date" class="metric-secondary-value">--</span></p>
        </article>
      </section>

      <section class="toolbar" aria-label="Chart controls" data-i18n-aria-label="aria.chartControls">
        <div class="segmented-control" role="group" aria-label="Time range" data-i18n-aria-label="aria.timeRange">
          <button type="button" class="is-active" data-range="7d" data-i18n="range.7d">7 d</button>
          <button type="button" data-range="28d" data-i18n="range.28d">28 d</button>
          <button type="button" data-range="90d" data-i18n="range.90d">90 d</button>
          <button type="button" data-range="180d" data-i18n="range.180d">180 d</button>
          <button type="button" data-range="ytd" data-i18n-year="range.ytd">YTD</button>
          <button type="button" data-range="1y" data-i18n="range.1y">1 y</button>
          <button type="button" data-range="3y" data-i18n="range.3y">3 y</button>
          <button type="button" data-range="all" data-i18n="range.all">All</button>
        </div>
        <div class="chart-controls">
          <div id="metric-toggle" class="metric-toggle" role="group" aria-label="Chart metric" data-i18n-aria-label="aria.chartMetric" hidden>
            <button type="button" class="is-active" data-metric="characters" aria-pressed="true" data-i18n="metric.characters">Characters</button>
            <button type="button" data-metric="players" aria-pressed="false" data-i18n="metric.players">Players</button>
          </div>
          <nav class="chart-tabs" aria-label="Chart views" data-i18n-aria-label="aria.chartViews">
            <button type="button" class="is-active" data-chart="timeline" data-i18n="chartView.timeline">Timeline</button>
            <button type="button" data-chart="heatmap" data-i18n="chartView.heatmap">Heatmap</button>
            <button type="button" data-chart="distribution" data-i18n="chartView.distribution">Distribution</button>
          </nav>
        </div>
      </section>

      <section
        class="chart-section"
        aria-label="Population chart"
        data-i18n-aria-label="aria.populationChart"
      >
        <div
          id="population-chart"
          class="chart"
          role="img"
          aria-label="MapleLegends population over time"
          data-i18n-aria-label="aria.populationChartImage"
        ></div>
      </section>
      <p class="details-note" id="details-note" data-i18n-timezone-note="details.localTimezone">
        Times shown in your local timezone.
      </p>

      <section class="details" aria-label="Dataset details" data-i18n-aria-label="aria.datasetDetails">
        <div>
          <span class="detail-label" data-i18n="details.samples">Samples</span>
          <strong id="sample-count">--</strong>
        </div>
        <div>
          <span class="detail-label" data-i18n="details.range">Range</span>
          <strong id="range-label">--</strong>
        </div>
        <div>
          <span class="detail-label" data-i18n="details.source">Source</span>
          <strong id="source-label">--</strong>
        </div>
      </section>
    </main>
  </body>
</html>
