name: Deploy Stats Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-stats-worker.yml"
      - "workers/stats/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

concurrency:
  group: deploy-stats-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Stats Worker
        run: npm test -- workers/stats

      - name: Type-check
        run: npm run typecheck

      - name: Deploy Stats Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/stats/wrangler.toml
